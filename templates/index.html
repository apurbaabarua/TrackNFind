<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Missing Person</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #6d082a, #e5b1cb, #e5b1cb, #6d082a);
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #91074c6c;
            padding: 75px;
            border-radius: 15px;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.2);
            width: 400px;
            text-align: center;
            animation: fadeIn 1s ease-in-out;
        }
        h2 {
            color: #6d082a;
            margin-bottom: 5px;
            margin-top: 5px;
        }
        label {
            display: block;
            margin-top: 16px;
            font-size: 16px;
            font-weight: 500;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 2px solid #6d082a;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
            color: black;
        }
        input:focus, textarea:focus {
            border-color: #6d082a;
            box-shadow: 0 0 8px rgba(172, 120, 133, 0.5);
            color: #060505;
        }
        input[type="file"] {
            
            background: white;
            padding: 8px;
            border-color: #6d082a;
        }
        button {
            margin-top: 15px;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: linear-gradient(135deg, #8b5d6d,#6d082a);
            color: white;
            transition: 0.3s;
            box-shadow: 0 4px 10px rgba(255, 47, 99, 0.3);
        }
        button:hover {
            background: #895465;
            transform: scale(1.05);
            color: #895465;
        }
        a {
            display: block;
            margin-top: 15px;
            color: #6d082a;
            text-decoration: none;
            font-weight: bold;
        }
        a:hover {
            text-decoration: underline;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
   
       
       
        
    
    
    <div class="container">
        <h2>Upload Missing Person Details</h2>

        {% if message %}
        <div style="background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; padding: 12px; border-radius: 8px; margin: 15px 0; font-size: 14px;">
            {{ message }}
        </div>
        {% endif %}

        {% if error %}
        <div style="background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; padding: 12px; border-radius: 8px; margin: 15px 0; font-size: 14px;">
            {{ error }}
        </div>
        {% endif %}

        <form action="/upload" method="POST" enctype="multipart/form-data">
            <label>Name:</label>
            <input type="text" name="name" required>

            <label>Age:</label>
            <input type="number" name="age" required>

            <label>Last Seen:</label>
            <input type="date" name="last_seen" required>

            <label>Description:</label>
            <textarea name="description" rows="3" required></textarea>

            <label>Upload Image:</label>
            <input type="file" name="file" accept="image/*" required>

            <button type="submit">Upload</button>
        </form>
        <a href="{{ url_for('detect') }}">Go to Real-Time Detection</a>
    </div>
</body>
</html>
