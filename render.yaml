services:
  - type: web
    name: tracknfind
    runtime: python
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "gunicorn --workers 1 --threads 2 --timeout 120 app:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: YOLO_CONFIG_DIR
        value: /tmp/Ultralytics
      - key: MONGO_URI
        sync: false
